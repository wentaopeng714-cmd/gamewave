<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5ed">
  <title>A Change of Scenery · Little Cycling Club</title>
  <style>
    :root { color-scheme: light; --paper:#f7f5ed; --ink:#354d47; --muted:#626f62; --accent:#df7457; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    main { width:min(1200px,calc(100% - 96px)); margin:0 auto; padding:48px 0 28px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; padding:0 8px 27px; }
    .eyebrow { display:flex; align-items:center; gap:10px; margin:0 0 13px; font-size:10px; font-weight:600; letter-spacing:2.6px; }
    .eyebrow::before { content:""; width:20px; height:2px; background:var(--accent); }
    h1 { margin:0; font-size:clamp(25px,3vw,37px); font-weight:500; letter-spacing:2px; line-height:1.35; }
    .edition { margin:0 0 4px; text-align:right; font-size:11px; letter-spacing:1.3px; line-height:2; color:var(--muted); }
    .edition span { display:block; font-family:Georgia,serif; font-size:15px; font-style:italic; letter-spacing:.5px; }
    .rider-bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; padding:0 8px 20px; }
    .animal-picker { display:flex; align-items:center; gap:14px; }
    .picker-label { color:var(--muted); font-size:12px; white-space:nowrap; }
    .animal-options { display:flex; gap:5px; }
    .animal-options button { display:flex; align-items:center; gap:7px; border:1px solid transparent; background:transparent; border-radius:22px; min-height:42px; padding:0 15px; font-size:12px; color:var(--muted); transition:background .2s,border-color .2s; }
    .animal-options button[aria-pressed="true"] { background:#e6ecdf; border-color:#bbcbb7; color:var(--ink); }
    .animal-dot { width:10px; height:10px; border:1px solid #8c9174; border-radius:50%; background:#efc978; }
    [data-choice="rabbit"] .animal-dot { background:#f9f2e4; }
    [data-choice="bear"] .animal-dot { background:#b78859; }
    .world-controls { display:flex; flex-wrap:wrap; align-items:center; gap:18px; }
    .world-field { display:flex; align-items:center; gap:9px; }
    .world-field label { color:var(--muted); font-size:12px; white-space:nowrap; }
    .world-field select { font:inherit; font-size:12px; color:var(--ink); background:#efefe5; border:1px solid #cbd4c4; border-radius:12px; min-height:42px; padding:0 10px; cursor:pointer; }
    select:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    .weather-badge { position:absolute; top:21px; right:24px; padding:7px 10px; border-radius:12px; color:#4c655b; background:#f7f8ecdc; font-size:10px; letter-spacing:.3px; pointer-events:none; }
    #sky-base { transition:fill 1.5s; }
    #sky-sun,#weather-clouds,#weather-tint,#snow-cover,#rain,#snowfall,#puddles { transition:opacity 1.2s; }
    #cloud { fill:var(--cloud-color,#fbfbef); }
    #weather-clouds { fill:var(--cloud-color,#fbfbef); }
    .face-heat,.warm-cheek { transition:opacity .22s; }
    .effort-mouth { display:none; }
    .scene { position:relative; overflow:hidden; border-radius:25px; background:#e9ede3; isolation:isolate; }
    #coast { display:block; width:100%; height:auto; aspect-ratio:1200/740; }
    .scene-label { position:absolute; top:26px; left:29px; display:flex; align-items:center; gap:8px; font-size:10px; letter-spacing:2px; color:#52695e; pointer-events:none; }
    .scene-label::before { content:""; width:5px; height:5px; border-radius:50%; background:#789587; }
    .scene-no { position:absolute; bottom:23px; right:29px; font:italic 13px Georgia,serif; color:#596852; pointer-events:none; }
    footer { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:20px; padding:23px 8px 0; }
    .note { margin:0; font-size:12px; color:var(--muted); letter-spacing:1px; }
    .controls { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:24px; }
    button { font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    #toggle { display:flex; align-items:center; justify-content:center; gap:9px; min-width:95px; height:42px; border:1px solid #cfd5c9; border-radius:24px; padding:0 17px; background:transparent; color:var(--ink); font-size:12px; transition:background .2s; }
    #toggle:hover { background:#e9ede3; }
    .play-icon { display:inline-flex; align-items:center; gap:3px; width:12px; height:14px; }
    .play-icon::before,.play-icon::after { content:""; width:3px; height:11px; background:currentColor; border-radius:1px; }
    .paused .play-icon { border-left:9px solid currentColor; border-top:6px solid transparent; border-bottom:6px solid transparent; width:0; height:0; margin:0 3px 0 0; }
    .paused .play-icon::before,.paused .play-icon::after { display:none; }
    .speed { display:flex; gap:9px; align-items:center; }
    .speed-label { margin-right:4px; font-size:11px; color:var(--muted); }
    .speed-options { display:flex; border:1px solid #d8dccf; border-radius:24px; padding:3px; gap:2px; }
    .speed button { border:0; color:var(--muted); background:transparent; font-size:11px; width:45px; height:32px; border-radius:20px; transition:background .2s,color .2s; }
    .speed button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (min-width:1600px) { main { padding-top:64px; } }
    @media (max-width:700px) {
      main { width:calc(100% - 32px); padding:28px 0 23px; }
      header { padding:0 4px 22px; gap:12px; }
      h1 { font-size:25px; letter-spacing:1px; }
      .eyebrow { font-size:8px; letter-spacing:1.9px; margin-bottom:11px; }
      .edition { display:none; }
      .edition span { font-size:12px; }
      .rider-bar { justify-content:center; padding:0 0 17px; gap:8px; }
      .animal-picker { gap:8px; }
      .animal-options { gap:2px; }
      .animal-options button { padding:0 8px; min-height:44px; font-size:11px; gap:5px; }
      .world-controls { width:100%; justify-content:center; gap:14px; }
      .world-field { gap:6px; }
      .world-field select { min-height:44px; max-width:116px; font-size:16px; padding:0 5px; }
      .world-field label { font-size:11px; }
      .weather-badge { top:15px; right:15px; font-size:9px; padding:5px 7px; }
      .scene { border-radius:18px; }
      #coast { aspect-ratio:880/740; }
      .scene-label { top:20px; left:20px; font-size:8px; }
      .scene-no { bottom:17px; right:19px; font-size:11px; }
      footer { justify-content:center; padding:20px 0 0; gap:17px; }
      .note { width:100%; text-align:center; font-size:11px; }
      .controls { width:100%; gap:14px; }
      #toggle { height:44px; }
      .speed button { width:44px; height:38px; }
    }
    @media (max-width:380px) { .edition { display:none; } .controls { gap:12px; } .speed-label { margin-right:0; } .speed { gap:6px; } }
    @media (prefers-reduced-motion:reduce) { #sky-base,#sky-sun,#weather-clouds,#weather-tint,#snow-cover,#rain,#snowfall,#puddles,.face-heat,.warm-cheek { transition:none; } }
  </style>
</head>

          <circle cx="588" cy="545" r="6" fill="#f6e7bd" stroke="#456959" stroke-width="2"/>
        </g>

        <!-- Woven front basket with a few flowers. -->
        <g id="basket" stroke-linecap="round" stroke-linejoin="round">
          <path d="M743 451L762 475M754 460H799" fill="none" stroke="#647e6a" stroke-width="3"/>
          <g id="flowers"><use href="#daisy" transform="translate(770 377) rotate(-15)"/><use href="#daisy" transform="translate(803 380) rotate(16) scale(.83)"/><use href="#daisy" transform="translate(785 362) rotate(7)"/></g>
          <path d="M747 407H821L812 456Q783 465 755 455Z" fill="#d4b580" stroke="#887d56" stroke-width="2.8"/>
          <path d="M762 412L768 455M777 411L779 459M792 411L790 459M807 411L801 456M752 420H818M753 432H816M756 444H813" fill="none" stroke="#b19564" stroke-width="2.2"/>
          <path d="M747 407H822" stroke="#8d805a" stroke-width="7"/><path d="M749 405H820" stroke="#e6cca0" stroke-width="3"/>
        </g>
        <g id="sweat" aria-hidden="true" pointer-events="none" visibility="hidden"></g>
        <g id="verge"><use href="#verge-tile"/><use href="#verge-tile" x="1200"/></g>
        <path id="weather-tint" d="M0 0H1200V740H0Z" fill="#567986" opacity="0" pointer-events="none"/>
        <g id="rain" opacity="0" aria-hidden="true" pointer-events="none" stroke="#6e9cae" stroke-width="2" stroke-linecap="round"></g>
        <g id="snowfall" opacity="0" aria-hidden="true" pointer-events="none"></g>
        <path fill="url(#paper-grain)" d="M0 0H1200V740H0Z" pointer-events="none"/>
      </svg>
      <div class="scene-no" id="scene-caption" aria-hidden="true">No. 01 — A breezy afternoon</div>
    </section>
    <footer>
      <p class="note" id="ride-mood">Pelican · Destination: a little happiness.</p>
      <div class="controls">
        <button id="toggle" type="button" aria-label="Pause animation"><span class="play-icon" aria-hidden="true"></span><span id="toggle-label">Pause</span></button>
        <div class="speed" role="group" aria-label="Cycling speed"><span class="speed-label">Speed</span><div class="speed-options"><button type="button" data-speed="0.5" aria-pressed="false" aria-label="Half speed">0.5×</button><button type="button" data-speed="1" aria-pressed="true" aria-label="Normal speed">1×</button><button type="button" data-speed="1.5" aria-pressed="false" aria-label="One and a half speed">1.5×</button><button type="button" data-speed="2" aria-pressed="false" aria-label="Double speed, rosy cheeks">2×</button><button type="button" data-speed="3" aria-pressed="false" aria-label="Triple speed, flying sweat">3×</button></div></div>
      </div>
    </footer>
    <p id="status" class="sr-only" aria-live="polite"></p>
  </main>
  <script>
    (() => {
      'use strict';
      const ids = ['coast','rider','rear-spokes','front-spokes','far-leg-path','far-foot','far-crank','far-pedal','near-leg-path','near-leg-color','near-foot','near-toes','near-crank','near-pedal','road','shore','verge','clouds','gulls','gull-one','gull-two','sailboat','scarf-tail','scarf-tip','flowers','eye','toggle','toggle-label','status','sweat','ride-mood','scene-title','scene-description','scene-choice','weather-choice','scene-label','scene-caption','weather-status','sky-base','sky-sun','weather-clouds','weather-tint','rain','snowfall','snow-cover','puddles','road-base','road-edge'];
      const el = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const narrow = window.matchMedia('(max-width: 700px)');
      const speedButtons = [...document.querySelectorAll('[data-speed]')];
      const animalButtons = [...document.querySelectorAll('[data-choice]')];
      const animalGroups = [...document.querySelectorAll('[data-animal]')];
      const eyes = [...document.querySelectorAll('.blinking-eye')];
      const extraScarves = [...document.querySelectorAll('.extra-scarf')];
      const landscapeGroups = [...document.querySelectorAll('[data-landscape]')];
      const landscapes = {
        coast: {name:'Coast',route:'along the coast',label:'COASTAL ROAD',caption:'No. 01 — A breezy afternoon',road:'#d9d4b9',edge:'#eee7ce'},
        forest: {name:'Forest',route:'along a woodland trail',label:'FOREST TRAIL',caption:'No. 02 — Into the green',road:'#c9c5a6',edge:'#e3dec2'},
        mountain: {name:'Mountains',route:'through mountain meadows',label:'MOUNTAIN PASS',caption:'No. 03 — A little closer to the sky',road:'#d5cbb5',edge:'#e9dfc6'},
        city: {name:'City',route:'through city streets',label:'CITY STREETS',caption:'No. 04 — Around the little town',road:'#c2c9bf',edge:'#e4e7d8'}
      };
      const weatherCycle = ['sunny','cloudy','rainy','snowy'];
      const weatherTypes = {
        sunny: {name:'Sunny',sky:'#e9ede3',cloud:'#fbfbef',sun:1,cloudCover:0,tint:0},
        cloudy: {name:'Cloudy',sky:'#d9e2dc',cloud:'#bdcbc5',sun:.25,cloudCover:.9,tint:.045},
        rainy: {name:'Rainy',sky:'#bfd0d2',cloud:'#95aeb1',sun:0,cloudCover:1,tint:.14},
        snowy: {name:'Snowy',sky:'#d3dfe0',cloud:'#c2d1d1',sun:.1,cloudCover:.85,tint:.045}
      };
      const WEATHER_INTERVAL = 16;
      const riders = {
        pelican: {name:'Pelican',fur:'#ddb365',far:'#b98743',foot:'#e7ba67',farFoot:'#c9984c',legWidth:8,head:[670,211],description:'A white pelican with a long golden bill, a rounded throat pouch and a coral scarf'},
        rabbit: {name:'Rabbit',fur:'#f3ede0',far:'#c9caba',foot:'#faf3e4',farFoot:'#d4d3c0',legWidth:17,head:[657,244],description:'A cream-colored rabbit with long ears, a fluffy tail and a green scarf'},
        bear: {name:'Bear',fur:'#b98b60',far:'#8e6f50',foot:'#bf9165',farFoot:'#987550',legWidth:22,head:[649,245],description:'A brown bear with round ears, a pale muzzle and a blue scarf'}
      };
      const TAU = Math.PI * 2;
      let playing = !reducedMotion.matches;
      let speed = 1;
      let animal = 'pelican';
      let time = 0;
      let worldTime = 0;
      let landscape = 'coast';
      let weather = 'sunny';
      let weatherMode = 'auto';
      let weatherAutoStarted = 0;
      let weatherAutoOffset = 0;
      let lastWeatherLabel = '';
      let previous = null;
      let frameId = null;
      const n = value => value.toFixed(2);
      function makeWeatherParticle(parent, tag, attributes) {
        const particle = document.createElementNS('http://www.w3.org/2000/svg', tag);
        Object.entries(attributes).forEach(([name, value]) => particle.setAttribute(name, value));
        parent.appendChild(particle);
        return particle;
      }
      const rainDrops = Array.from({length:78}, (_, index) => makeWeatherParticle(el.rain, 'path', {
        d:`M0 0l-12 ${24 + index % 4 * 7}`, opacity:'.55'
      }));
      const snowflakes = Array.from({length:52}, (_, index) => index % 4 === 0
        ? makeWeatherParticle(el.snowfall, 'path', {d:'M0-6V6M-5-3L5 3M-5 3L5-3',fill:'none',stroke:'#fcfff4','stroke-width':'2','stroke-linecap':'round'})
        : makeWeatherParticle(el.snowfall, 'circle', {r:String(2.8 + index % 4),fill:'#fbfff5',stroke:'#b5ced0','stroke-width':'.65',opacity:'.92'}));
      function updateWeatherLabel() {
        const seconds = Math.ceil(WEATHER_INTERVAL - (worldTime - weatherAutoStarted) % WEATHER_INTERVAL);
        const suffix = weatherMode === 'auto' ? (playing ? `Changes in ${seconds}s` : 'Auto paused') : 'Fixed';
        const label = `${weatherTypes[weather].name} · ${suffix}`;
        if (label !== lastWeatherLabel) { el['weather-status'].textContent = label; lastWeatherLabel = label; }
      }
      function updateDescription() {
        const rider = riders[animal];
        const effect = speed >= 3 ? 'The rider turns red as blue sweat droplets fly from its head and body. ' : speed >= 2 ? 'The face and cheeks turn red. ' : 'The rider pedals at an easy pace. ';
        el['scene-title'].textContent = `${rider.name} riding — ${landscapes[landscape].name}`;
        el['scene-description'].textContent = `${rider.description} rides a mint-green bicycle ${landscapes[landscape].route}, pedaling at ${speed} times normal speed. ${effect}The weather is ${weatherTypes[weather].name.toLowerCase()}. ${weatherMode === 'auto' ? 'Weather changes automatically every 16 seconds.' : 'Weather is set manually.'}`;
        return effect;
      }
      function applyWeather(next, announce = false) {
        weather = next;
        const type = weatherTypes[weather];
        el.coast.dataset.weather = weather;
        el.coast.style.setProperty('--cloud-color', type.cloud);
        el['sky-base'].style.fill = type.sky;
        el['sky-sun'].setAttribute('opacity', type.sun);
        el['weather-clouds'].setAttribute('opacity', type.cloudCover);
        el['weather-tint'].setAttribute('opacity', type.tint);
        el.rain.setAttribute('opacity', weather === 'rainy' ? '1' : '0');
        el.snowfall.setAttribute('opacity', weather === 'snowy' ? '1' : '0');
        el['snow-cover'].setAttribute('opacity', weather === 'snowy' ? '1' : '0');
        el.puddles.setAttribute('opacity', weather === 'rainy' ? '.7' : '0');
        updateDescription();
        updateWeatherLabel();
        if (announce) el.status.textContent = `${weatherMode === 'auto' ? 'Weather changed automatically to' : 'Weather set to'} ${type.name.toLowerCase()}.`;
      }
      function setLandscape(next, announce = true) {
        landscape = next;
        const place = landscapes[landscape];
        landscapeGroups.forEach(group => { group.style.display = group.dataset.landscape === landscape ? '' : 'none'; });
        el.coast.dataset.landscape = landscape;
        el['road-base'].setAttribute('fill', place.road);
        el['road-edge'].setAttribute('stroke', place.edge);
        el['scene-label'].textContent = place.label;
        el['scene-caption'].textContent = place.caption;
        el.gulls.style.display = landscape === 'coast' ? '' : 'none';
        updateDescription();
        draw();
        if (announce) el.status.textContent = `Scene changed to ${place.name}. ${riders[animal].name} stays at ${speed} times normal speed. ${playing ? 'The ride continues.' : 'The animation remains paused.'}`;
      }
      function drawWeather() {
        el['weather-clouds'].setAttribute('transform', `translate(${n(Math.sin(worldTime * .14) * 24)} 0)`);
        if (weather === 'rainy') rainDrops.forEach((drop, index) => {
          const x = ((index * 173 - worldTime * 190) % 1400 + 1400) % 1400 - 100;
          const y = (index * 97 + worldTime * (630 + index % 4 * 38)) % 860 - 60;
          drop.setAttribute('transform', `translate(${n(x)} ${n(y)})`);
        });
        if (weather === 'snowy') snowflakes.forEach((flake, index) => {
          const x = ((index * 137 - worldTime * 12 + Math.sin(worldTime * .75 + index) * 23) % 1280 + 1280) % 1280 - 40;
          const y = (index * 79 + worldTime * (35 + index % 5 * 8)) % 820 - 40;
          flake.setAttribute('transform', `translate(${n(x)} ${n(y)}) rotate(${n(worldTime * 24 + index * 17)})`);
        });
        updateWeatherLabel();
      }
      // A fixed particle pool keeps the sweat lightweight, even at triple speed.
      const drops = Array.from({length:28}, (_, index) => {
        const drop = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        drop.setAttribute('d', 'M0-11C-2-6-6 0-6 4A6 6 0 0 0 6 4C6 0 2-6 0-11Z');
        drop.setAttribute('fill', index % 3 === 0 ? '#c1e6e8' : '#75b9c9');
        drop.setAttribute('stroke', '#448797');
        drop.setAttribute('stroke-width', '1.2');
        el.sweat.appendChild(drop);
        return drop;
      });
      function updateAppearance(announce = false) {
        const rider = riders[animal];
        el.coast.dataset.animal = animal;
        el.coast.dataset.speed = String(speed);
        animalGroups.forEach(group => { group.style.display = group.dataset.animal === animal ? '' : 'none'; });
        animalButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.choice === animal)));
        document.querySelectorAll('.face-heat').forEach(face => face.setAttribute('opacity', speed >= 2 ? (speed >= 3 ? '1' : '.88') : '0'));
        document.querySelectorAll('.warm-cheek').forEach(cheek => cheek.setAttribute('opacity', speed >= 2 ? '.8' : '0'));
        document.querySelectorAll('.relaxed-mouth').forEach(mouth => { mouth.style.display = speed >= 3 ? 'none' : ''; });
        document.querySelectorAll('.effort-mouth').forEach(mouth => { mouth.style.display = speed >= 3 ? 'inline' : 'none'; });
        el.sweat.setAttribute('visibility', speed >= 3 ? 'visible' : 'hidden');
        el['near-leg-color'].setAttribute('stroke', rider.fur);
        el['near-leg-color'].setAttribute('stroke-width', rider.legWidth);
        el['near-leg-path'].setAttribute('stroke-width', rider.legWidth + 5);
        el['far-leg-path'].setAttribute('stroke', rider.far);
        el['far-leg-path'].setAttribute('stroke-width', rider.legWidth + 2);
        el['near-foot'].setAttribute('fill', rider.foot);
        el['far-foot'].setAttribute('fill', rider.farFoot);
        const mood = speed >= 3 ? 'Sweating buckets. Onward we go!' : speed >= 2 ? 'Rosy cheeks. Keep pedaling!' : 'Destination: a little happiness.';
        el['ride-mood'].textContent = `${rider.name} · ${mood}`;
        const effect = updateDescription();
        if (announce) el.status.textContent = `${rider.name}, ${speed} times normal speed. ${effect}${playing ? '' : 'Animation paused.'}`;
        // Changes are visible immediately, including while the animation is paused.
        draw();
      }
      function drawSweat(bob) {
        if (speed < 3) return;
        const [headX, headY] = riders[animal].head;
        drops.forEach((drop, index) => {
          const age = (time * .58 + index / drops.length) % 1;
          const angle = index * 2.399963;
          const fromBody = index % 5 === 0;
          const originX = fromBody ? 595 : headX;
          const originY = fromBody ? 346 : headY;
          const vx = Math.cos(angle) * (138 + index % 4 * 26) - 38;
          const vy = Math.sin(angle) * (122 + index % 3 * 20) - 56;
          const x = originX + Math.cos(angle) * 53 + vx * age;
          const y = originY + Math.sin(angle) * 43 + vy * age + 92 * age * age + bob;
          const rotation = Math.atan2(vy + 184 * age, vx) * 180 / Math.PI - 90;
          const scale = (.8 + index % 4 * .19) * (1 - .2 * age);
          drop.setAttribute('transform', `translate(${n(x)} ${n(y)}) rotate(${n(rotation)}) scale(${n(scale)})`);
          drop.setAttribute('opacity', n(Math.pow(Math.sin(Math.PI * age), .65) * .94));
        });
      }
      function poseLeg(side, phase, bob) {
        const hip = {x:side === 'near' ? 536 : 530,y:(side === 'near' ? 399 : 394) + bob};
        const foot = {x:588 + 33 * Math.cos(phase),y:545 + 33 * Math.sin(phase)};
        const dx = foot.x - hip.x, dy = foot.y - hip.y;
        const d = Math.hypot(dx, dy), upper = 103, lower = 108;
        const a = (upper * upper - lower * lower + d * d) / (2 * d);
        const h = Math.sqrt(Math.max(0, upper * upper - a * a));
        const knee = {x:hip.x + a * dx / d + h * dy / d,y:hip.y + a * dy / d - h * dx / d};
        const path = `M${n(hip.x)} ${n(hip.y)}Q${n(knee.x-8)} ${n(knee.y-9)} ${n(knee.x)} ${n(knee.y)}L${n(foot.x)} ${n(foot.y-7)}`;
        el[`${side}-leg-path`].setAttribute('d', path);
        if (side === 'near') el['near-leg-color'].setAttribute('d', path);
        el[`${side}-crank`].setAttribute('d', `M588 545L${n(foot.x)} ${n(foot.y)}`);
        const footPath = animal === 'pelican'
          ? `M${n(foot.x-11)} ${n(foot.y-10)}Q${n(foot.x+1)} ${n(foot.y-14)} ${n(foot.x+9)} ${n(foot.y-7)}L${n(foot.x+22)} ${n(foot.y-2)}Q${n(foot.x+25)} ${n(foot.y+3)} ${n(foot.x+17)} ${n(foot.y+3)}H${n(foot.x-12)}Z`
          : `M${n(foot.x-11)} ${n(foot.y-13)}Q${n(foot.x)} ${n(foot.y-19)} ${n(foot.x+11)} ${n(foot.y-10)}L${n(foot.x+(animal === 'rabbit' ? 27 : 20))} ${n(foot.y-5)}Q${n(foot.x+32)} ${n(foot.y+5)} ${n(foot.x+18)} ${n(foot.y+4)}H${n(foot.x-12)}Q${n(foot.x-19)} ${n(foot.y)} ${n(foot.x-11)} ${n(foot.y-13)}Z`;
        el[`${side}-foot`].setAttribute('d', footPath);
        if (side === 'near') el['near-toes'].setAttribute('d', animal === 'pelican' ? '' : `M${n(foot.x+13)} ${n(foot.y-2)}v5m5-5v5`);
        el[`${side}-pedal`].setAttribute('d', `M${n(foot.x-13)} ${n(foot.y+5)}h31`);
      }
      function draw() {
        const phase = time * TAU / 2.8;
        const wheel = phase * 1.2;
        const degrees = n(wheel * 180 / Math.PI % 360);
        const bob = Math.sin(phase * 2) * (speed >= 3 ? 3.3 : 2);
        el['rear-spokes'].setAttribute('transform', `translate(445 550) rotate(${degrees})`);
        el['front-spokes'].setAttribute('transform', `translate(755 550) rotate(${degrees})`);
        el.rider.setAttribute('transform', `translate(0 ${n(bob)})`);
        poseLeg('far', phase + Math.PI, bob);
        poseLeg('near', phase, bob);
        const distance = wheel * 100;
        el.road.setAttribute('transform', `translate(${-distance % 1200} 0)`);
        el.verge.setAttribute('transform', `translate(${-distance % 1200} 0)`);
        el.shore.setAttribute('transform', `translate(${-distance * .09 % 1200} 0)`);
        el.clouds.setAttribute('transform', `translate(${-worldTime * 9 % 1400} 0)`);
        el.gulls.setAttribute('transform', `translate(${n(-Math.sin(time * .13) * 34)} ${n(Math.sin(time * .7) * 5)})`);
        const flap = Math.sin(time * 2.8) * 4;
        el['gull-one'].setAttribute('d', `M319 207q11 ${n(-11+flap)} 22 0q11 ${n(-11+flap)} 22 0`);
        el['gull-two'].setAttribute('d', `M374 180q8 ${n(-8-flap*.65)} 16 0q8 ${n(-8-flap*.65)} 16 0`);
        el.sailboat.setAttribute('transform', `translate(${n(992-Math.sin(time*.05)*50)} ${n(385+Math.sin(time*1.3)*1.3)})`);
        el['scarf-tail'].setAttribute('transform', `rotate(${n(Math.sin(time*5)*3)} 634 299)`);
        el['scarf-tip'].setAttribute('transform', `rotate(${n(Math.sin(time*5+1)*4)} 636 304)`);
        extraScarves.forEach((scarf, index) => scarf.setAttribute('transform', `rotate(${n(Math.sin(time*5+index)*4)} ${scarf.dataset.pivot})`));
        el.flowers.setAttribute('transform', `rotate(${n(Math.sin(time*4)*2)} 785 410)`);
        const blinkPhase = time % 5.7;
        const blinkScale = blinkPhase > 5.45 ? Math.max(.08, Math.abs(blinkPhase-5.575)/.125) : 1;
        eyes.forEach(eye => eye.setAttribute('transform', `translate(0 ${n(Number(eye.dataset.eyeY)*(1-blinkScale))}) scale(1 ${n(blinkScale)})`));
        drawSweat(bob);
        drawWeather();
      }
      function animate(now) {
        frameId = null;
        if (!playing || document.hidden) { previous = null; return; }
        if (previous !== null) {
          const elapsed = Math.max(0, (now - previous) / 1000);
          time += Math.min(elapsed, .05) * speed;
          worldTime += elapsed;
        }
        previous = now;
        if (weatherMode === 'auto') {
          const nextWeather = weatherCycle[(weatherAutoOffset + Math.floor((worldTime - weatherAutoStarted) / WEATHER_INTERVAL)) % weatherCycle.length];
          if (weather !== nextWeather) applyWeather(nextWeather, true);
        }
        draw();
        frameId = requestAnimationFrame(animate);
      }
      function schedule() {
        if (playing && !document.hidden && frameId === null) frameId = requestAnimationFrame(animate);
      }
      function setPlaying(value, announce = true) {
        playing = value;
        previous = null;
        el.toggle.classList.toggle('paused', !playing);
        el.toggle.setAttribute('aria-label', playing ? 'Pause animation' : 'Play animation');
        el['toggle-label'].textContent = playing ? 'Pause' : 'Play';
        if (!playing && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        if (announce) el.status.textContent = playing ? 'Animation resumed' : 'Animation paused';
        updateWeatherLabel();
        schedule();
      }
      el.toggle.addEventListener('click', () => setPlaying(!playing));
      el['scene-choice'].addEventListener('change', event => setLandscape(event.target.value));
      el['weather-choice'].addEventListener('change', event => {
        weatherMode = event.target.value;
        if (weatherMode === 'auto') {
          weatherAutoStarted = worldTime;
          weatherAutoOffset = weatherCycle.indexOf(weather);
          updateDescription();
          updateWeatherLabel();
          el.status.textContent = 'Automatic weather enabled. Weather changes every 16 seconds.';
        } else applyWeather(weatherMode, true);
        draw();
      });
      animalButtons.forEach(button => button.addEventListener('click', () => {
        animal = button.dataset.choice;
        updateAppearance(true);
      }));
      speedButtons.forEach(button => button.addEventListener('click', () => {
        speed = Number(button.dataset.speed);
        speedButtons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        updateAppearance(true);
      }));
      document.addEventListener('visibilitychange', () => {
        previous = null;
        if (document.hidden && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        schedule();
      });
      reducedMotion.addEventListener('change', event => { if (event.matches) setPlaying(false); });
      function resizeScene() { el.coast.setAttribute('viewBox', narrow.matches ? '160 0 880 740' : '0 0 1200 740'); }
      narrow.addEventListener('change', resizeScene);
      resizeScene();
      setLandscape(landscape, false);
      applyWeather(weather);
      updateAppearance();
      setPlaying(playing, false);
    })();
  </script>
